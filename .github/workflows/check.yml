# SPDX-License-Identifier: MIT
#
# Runs every check of the flake on x86_64-linux and aarch64-linux, then the
# parts of the conformance checks that need Nix or the network outside the
# sandbox.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L
      # A second build of the app fixture's package gives the same output.
      - name: conformance-rebuild
        run: |
          system="$(nix config show system)"
          nix build --rebuild -L ".#checks.$system.conformance-rebuild"
      # The relock of tests/fixtures/remote, whose git dependency the lock
      # command prefetches into the Nix store, reproduces its purifier
      # lockfile byte for byte.
      - name: conformance-relock
        run: |
          cp -r tests/fixtures/remote "$RUNNER_TEMP/remote"
          chmod -R u+w "$RUNNER_TEMP/remote"
          rm "$RUNNER_TEMP/remote/yarn-classic-purifier.lock.json"
          (cd "$RUNNER_TEMP/remote" && nix run "$GITHUB_WORKSPACE#yarn-classic-purifier" -- lock)
          cmp tests/fixtures/remote/yarn-classic-purifier.lock.json "$RUNNER_TEMP/remote/yarn-classic-purifier.lock.json"
      # After `yarn-classic-purifier prefetch`, the yarn wrapper installs,
      # builds and tests the app fixture with the network cut off.
      - name: conformance-offline
        run: |
          cp -r tests/fixtures/app "$RUNNER_TEMP/app"
          chmod -R u+w "$RUNNER_TEMP/app"
          nix build --out-link "$RUNNER_TEMP/yarn" "$GITHUB_WORKSPACE#yarn"
          cd "$RUNNER_TEMP/app"
          nix run "$GITHUB_WORKSPACE#yarn-classic-purifier" -- prefetch
          sudo unshare -n sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            sh -c "$RUNNER_TEMP/yarn/bin/yarn install --frozen-lockfile && $RUNNER_TEMP/yarn/bin/yarn run build && $RUNNER_TEMP/yarn/bin/yarn run test"

  composition-native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - run: python3 tests/composition-native.py

  legacy-native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Selected EOL toolchain native workflow
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          tools="$(nix build --no-link --print-out-paths ".#checks.$system.legacy-node-tools")"
          release="$(nix build --no-link --print-out-paths ".#checks.$system.legacy-node.release")"
          python3 tests/legacy-native.py "$tools" "$release/legacy-app.tgz"
      - name: SDK context without import from derivation
        run: nix eval --impure --option allow-import-from-derivation false --json --expr 'import ./tests/sdk-context.nix {}'
      - name: SDK recipe survives ordinary store copy
        run: python3 tests/sdk-portable.py
